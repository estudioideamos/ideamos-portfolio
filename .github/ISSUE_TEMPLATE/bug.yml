name: Reportar un problema
description: Un error en el portfolio, un enlace o una vista previa.
body:
  - type: textarea
    id: problem
    attributes:
      label: Qué sucede
      description: Incluí la página, el proyecto y cómo reproducirlo. No publiques contraseñas ni datos privados.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Dispositivo y navegador
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas ver
